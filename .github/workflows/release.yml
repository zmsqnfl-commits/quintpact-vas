name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    name: Verify Windows before publishing
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Install Python test dependencies
        run: python -m pip install -r tests/requirements-dev.txt
      - name: Install Node dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install chromium
      - name: Verify privacy and connected Windows contracts
        run: python -m pytest -q tests/test_privacy_regressions.py tests/test_session_http.py tests/test_session_web.py tests/test_session_design_contract.py tests/test_session_execution.py tests/test_server_response_recovery.py tests/test_memory_policy.py tests/test_memory_retention.py tests/test_memory_http_errors.py tests/test_memory_paths.py tests/test_runtime_state.py tests/test_encoded_credentials.py
      - name: Verify PowerShell runtime integration
        run: python tests/test_windows_runtime.py
      - name: Verify connected Windows browser workflows
        run: npx playwright test -c tests/playwright.config.js tests/integrated-runtime.spec.js --workers=1
      - name: Verify connected session design
        run: npm run test:session-design
      - name: Build the Windows release
        run: python scripts/build_release.py
      - name: Verify the extracted Windows package
        run: python tests/test_release_runtime_flow.py
  release:
    needs: windows
    name: Verify and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tests/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
      - name: Require a main-branch release commit
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify tag matches VAS version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="$(python -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
          test "$RELEASE_TAG" = "v$version"
      - name: Install test dependencies
        run: |
          python -m pip install -r tests/requirements-dev.txt
          npm ci
          npx playwright install --with-deps chromium
      - name: Run Python checks
        run: npm run test:python
      - name: Run browser checks
        run: npm run test:browser
      - name: Build and verify release packages
        run: npm run test:package
      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          assets=(
            "dist/VAS-${version}-windows.zip"
            "dist/VAS-Client-Form-${version}.zip"
            "dist/release-manifest.json"
            "dist/SHA256SUMS.txt"
          )
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
              --verify-tag --notes-file "docs/releases/${version}.md" --title "VAS ${version}"
          fi
