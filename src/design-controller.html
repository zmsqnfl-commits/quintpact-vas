<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VAS 2.6.4 — 디자인 스튜디오</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 fill=%22%23111111%22/><text x=%2250%22 y=%2272%22 font-size=%2275%22 font-family=%22monospace%22 font-weight=%22bold%22 text-anchor=%22middle%22 fill=%22%23ffffff%22>V</text></svg>">
  <link rel="stylesheet" href="editorial-shell.css">
  <link rel="stylesheet" href="setup-tools.css">
  <link rel="stylesheet" href="design-controller.css">
  <link rel="stylesheet" href="design-preview.css">
  <link rel="stylesheet" href="design-collection.css">
  <link rel="stylesheet" href="design-samples.css">
</head>
<body>
  <header class="studio-topbar">
    <a href="vas-hub.html" data-vas-link>← 시작</a>
    <strong>VAS 디자인 스튜디오</strong>
    <div class="studio-tools"><div class="setup-actions"><button type="button" data-setup-help>사용 방법</button><button type="button" data-setup-settings>설정</button></div><button type="button" onclick="undoTheme()">이전 설정</button></div>
  </header>

  <nav class="mobile-view-tabs" aria-label="모바일 보기 전환">
    <button type="button" class="active" data-studio-view="settings" aria-pressed="true">설정</button>
    <button type="button" data-studio-view="preview" aria-pressed="false">미리보기</button>
  </nav>

  <main class="app" data-mobile-view="settings">
    <aside class="controls" id="controlsPanel" aria-label="디자인 설정">
      <div class="controls-intro">
        <p class="eyebrow">PROJECT DESIGN / 2.6.4</p>
        <h1>VAS 디자인<br>스튜디오</h1>
        <p>원하는 분위기를 고르고, 화면 구성부터 세부 스타일까지 확인하세요.</p>
      </div>

      <section class="group" id="preset-container" aria-labelledby="presetTitle">
        <h2 id="presetTitle">프리셋</h2>
      </section>

      <section class="group">
        <h2>취향 방향</h2>
        <div class="field">
          <label for="tasteProfileMode">Taste Profile</label>
          <select id="tasteProfileMode" onchange="setTasteProfileMode(this.value)">
            <option value="auto">프리셋 기준 자동</option>
          </select>
        </div>
        <details class="prompt-details">
          <summary>에이전트용 디자인 프롬프트</summary>
          <textarea id="aiPrompt" class="prompt-box" readonly aria-label="에이전트용 디자인 프롬프트"></textarea>
          <label class="check-line"><input type="checkbox" id="includeRagContext"> 복사할 때 현재 프로젝트 RAG도 포함</label>
          <button type="button" class="btn btn-primary" onclick="copyAgentPrompt()">프롬프트 복사</button>
          <p id="ragPromptStatus">기본 프롬프트만 복사합니다.</p>
        </details>
      </section>

      <section class="group token-controls">
        <h2>세부 토큰</h2>
        <div class="field"><label for="fontFamily">글꼴</label><select id="fontFamily" onchange="update()"><option value="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">시스템 Sans</option><option value="ui-monospace, 'Cascadia Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace">시스템 Mono</option><option value="'Bricolage Grotesque', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">Bricolage Grotesque · 개성 있는 Sans</option><option value="'DM Serif Display', Georgia, 'Batang', serif">DM Serif Display · 우아한 Serif</option><option value="'Space Grotesk', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">Space Grotesk · 기하학 Sans</option><option value="'Caprasimo', Georgia, 'Batang', serif">Caprasimo · 레트로 Serif</option><option value="'Anton', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif">Anton · 포스터 Sans</option><option value="'Cormorant Garamond', Georgia, 'Batang', serif">Cormorant Garamond · 섬세한 Serif</option></select></div>
        <div class="field range-field"><label for="fontSize">글자 크기 <output id="fsVal">16px</output></label><input type="range" id="fontSize" min="12" max="24" value="16" step="1" oninput="update()"></div>
        <div class="field range-field"><label for="letterSpacing">자간 <output id="lsVal">-0.04em</output></label><input type="range" id="letterSpacing" min="-0.1" max="0.2" value="-0.04" step="0.01" oninput="update()"></div>
        <div class="field range-field"><label for="padding">여백 <output id="padVal">40px</output></label><input type="range" id="padding" min="12" max="64" value="40" step="4" oninput="update()"></div>
        <div class="field range-field"><label for="radius">모서리 <output id="radVal">0px</output></label><input type="range" id="radius" min="0" max="40" value="0" step="2" oninput="update()"></div>
        <div class="field range-field"><label for="borderWidth">테두리 <output id="borderVal">1px</output></label><input type="range" id="borderWidth" min="0" max="8" value="1" step="1" oninput="update()"></div>
        <div class="field range-field"><label for="shadow">그림자 <output id="shadowVal">0px</output></label><input type="range" id="shadow" min="0" max="80" value="0" step="4" oninput="update()"></div>
        <div class="field range-field"><label for="speed">모션 <output id="speedVal">0.50s</output></label><input type="range" id="speed" min="0.1" max="1" value="0.5" step="0.1" oninput="update()"></div>
        <div class="color-grid">
          <label>주색<input type="color" id="colorPrimary" value="#111111" oninput="update()"></label>
          <label>배경<input type="color" id="colorBg" value="#e8e8e5" oninput="update()"></label>
          <label>표면<input type="color" id="colorSurface" value="#e8e8e5" oninput="update()"></label>
          <label>글자<input type="color" id="colorText" value="#111111" oninput="update()"></label>
          <label>선<input type="color" id="colorBorder" value="#111111" oninput="update()"></label>
          <label>완료<input type="color" id="colorSuccess" value="#10b981" oninput="update()"></label>
        </div>
      </section>

      <section class="group export-group">
        <h2>토큰 내보내기</h2>
        <div class="actions"><button type="button" class="btn btn-secondary" onclick="showExport('json')">코드 보기</button><button type="button" class="btn btn-secondary" onclick="downloadJSON()">JSON 저장</button></div>
        <label class="drag-zone" id="dragZone" for="fileInput">저장한 JSON 토큰 불러오기<input type="file" id="fileInput" accept=".json,application/json" onchange="handleFileSelect(event)"></label>
        <div class="token-output" id="tokenOutput">
          <div class="export-tabs" role="tablist" aria-label="토큰 형식"><button type="button" class="tab-btn active" onclick="switchFormat('json', this)">JSON</button><button type="button" class="tab-btn" onclick="switchFormat('css', this)">CSS</button><button type="button" class="tab-btn" onclick="switchFormat('tailwind', this)">Tailwind</button></div>
          <pre id="tokenPre"></pre><button type="button" class="btn btn-secondary" onclick="copyOutput()">코드 복사</button>
        </div>
      </section>
    </aside>

    <section class="preview" aria-labelledby="previewTitle">
      <div class="preview-heading"><h2 id="previewTitle">디자인 미리보기</h2><a id="openDesignSample" href="design-sample.html" target="_blank" rel="noopener">샘플 사이트 열기 ↗</a></div>
      <div class="adv-preview" id="advPreview"></div>
      <p class="preview-note">스타일을 비교하는 예시입니다. 문구와 데이터는 실제 프로젝트에 맞춰 바뀝니다.</p>
    </section>
  </main>

  <footer class="studio-applybar">
    <button type="button" class="reset-theme" onclick="undoTheme()">변경 사항 되돌리기</button>
    <button type="button" class="apply-theme" id="applyProjectTheme">설정 저장하고 돌아가기 <span aria-hidden="true">→</span></button>
    <p id="applyProjectStatus" role="status" hidden></p>
  </footer>

  <div class="toast" id="dc-toast" role="status"></div>
  <script src="vas-config.js"></script>
  <script src="storage-utils.js"></script>
  <script src="theme-state.js"></script>
  <script src="editorial-theme.js"></script>
  <script src="runtime-client.js"></script>
  <script src="project-context.js"></script>
  <script src="knowledge-index.js"></script>
  <script src="rag-lite.js"></script>
  <script src="personalization-store.js"></script>
  <script src="setup-tools.js"></script>
  <script src="project-rail.js"></script>
  <script src="design-presets.js"></script>
  <script src="agent-resources.js"></script>
  <script src="design-taste-pack.js"></script>
  <script src="design-profile-control.js"></script>
  <script src="design-collection.js"></script>
  <script src="design-samples.js"></script>
  <script src="design-preview.js"></script>
  <script src="design-controller.js"></script>
  <script src="design-sample-link.js"></script>
</body>
</html>
